spring.config.import=optional:file:.env[.properties]
spring.application.name=BloodBridge
spring.profiles.default=mysql
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jackson.deserialization.fail-on-unknown-properties=true
server.tomcat.max-http-form-post-size=16KB
server.max-http-request-header-size=16KB

bloodbridge.supabase-url=${SUPABASE_URL:}
bloodbridge.supabase-key=${SUPABASE_ANON_KEY:}
bloodbridge.site-origin=${SITE_ORIGIN:http://localhost:8080}
bloodbridge.admin-ids=${BLOODBRIDGE_ADMIN_IDS:}
bloodbridge.family-assistance-enabled=${FAMILY_ASSISTANCE_ENABLED:false}
bloodbridge.admin-username=${ADMIN_USERNAME:}
bloodbridge.admin-password-hash=${ADMIN_PASSWORD_HASH:}
bloodbridge.resend-api-key=${RESEND_API_KEY:}
bloodbridge.mail-from=${MAIL_FROM:}
server.forward-headers-strategy=native
